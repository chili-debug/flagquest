<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

<body>
  <header class="topbar">
    <button class="brand" data-action="home" aria-label="FlagQuest — home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z" fill="#fff"/><path d="M4 22v-7"/></svg>

      <div class="lang-switch" role="group" aria-label="Language">
        <button data-lang="en" aria-pressed="true">EN</button>
        <button data-lang="fr" aria-pressed="false">FR</button>
      </div>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js" defer></script>
